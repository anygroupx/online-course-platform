# 在线课程平台 Docker Compose 配置
# 模式：本地 Docker + VPN + VPS Nginx 反向代理

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: course-mysql
    restart: unless-stopped
    environment:
      # 密码必须由未纳入版本控制的 .env 或密钥管理系统提供。
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-online_course}
      - MYSQL_USER=${MYSQL_USER:-course_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      - TZ=Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    ports:
      - "13306:3306"  # 映射到宿主机 13306，保持与原配置一致
    networks:
      - local_net
    healthcheck:
      # 使用真实查询验证认证与数据库可用性，避免 mysqladmin ping 在认证失败时仍返回成功。
      test:
        [
          "CMD-SHELL",
          'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -uroot --silent --skip-column-names -e "SELECT 1" >/dev/null',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # Redis 缓存（可选，如不需要可注释）
  redis:
    image: redis:7
    container_name: course-redis
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      # Redis 密码必须由未纳入版本控制的 .env 或密钥管理系统提供。
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - local_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      [
        "sh",
        "-c",
        'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"',
      ]

  # Elasticsearch 全文搜索
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: course-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - TZ=Asia/Shanghai
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - local_net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Spring Boot 后端
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: course-platform-backend:latest
    container_name: course-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - TZ=Asia/Shanghai
      # 共享 external network 上使用唯一容器名，避免命中其他项目的同名别名
      - SPRING_DATASOURCE_URL=jdbc:mysql://course-mysql:3306/${MYSQL_DATABASE:-online_course}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER:-course_user}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      # Redis 配置（如启用）
      - SPRING_DATA_REDIS_HOST=course-redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # JWT 密钥
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - APP_CRYPTO_SECRET=${APP_CRYPTO_SECRET:?APP_CRYPTO_SECRET is required}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-true}
      - OUTBOUND_DNS_MODE=${OUTBOUND_DNS_MODE:-system}
      - OUTBOUND_PROVIDER_ALLOWED_HOSTS=${OUTBOUND_PROVIDER_ALLOWED_HOSTS:-}
      - OUTBOUND_PROVIDER_HTTP_ALLOWED_HOSTS=${OUTBOUND_PROVIDER_HTTP_ALLOWED_HOSTS:-}
      - OUTBOUND_PROVIDER_ALLOWED_PORTS=${OUTBOUND_PROVIDER_ALLOWED_PORTS:-}
      - OUTBOUND_ALERT_ALLOWED_HOSTS=${OUTBOUND_ALERT_ALLOWED_HOSTS:-}
      - OUTBOUND_ALERT_HTTP_ALLOWED_HOSTS=${OUTBOUND_ALERT_HTTP_ALLOWED_HOSTS:-}
      - SECURITY_ALERT_WEBHOOK=${SECURITY_ALERT_WEBHOOK:-}
      - MFA_ISSUER=${MFA_ISSUER:-OnlineCoursePlatform}
      - PAYMENT_RECONCILE_ENABLED=${PAYMENT_RECONCILE_ENABLED:-true}
      - PAYMENT_RECONCILE_CRON=${PAYMENT_RECONCILE_CRON:-0 15 1 * * ?}
      # 跨域来源必须由部署环境显式指定
      - COURSE_SECURITY_ALLOWED_ORIGINS=${COURSE_SECURITY_ALLOWED_ORIGINS:?COURSE_SECURITY_ALLOWED_ORIGINS is required}
      - API_DOC_ENABLED=${API_DOC_ENABLED:-false}
      # Cloudflare Turnstile：生产默认启用，私钥仅从未纳入版本控制的 .env 注入。
      - TURNSTILE_ENABLED=${TURNSTILE_ENABLED:-true}
      - TURNSTILE_ALWAYS_REQUIRED=${TURNSTILE_ALWAYS_REQUIRED:-true}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_FAIL_CLOSED=${RATE_LIMIT_FAIL_CLOSED:-true}
      - LOGIN_PROTECTION_ENABLED=${LOGIN_PROTECTION_ENABLED:-true}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:?TURNSTILE_SECRET_KEY is required}
      - TURNSTILE_EXPECTED_HOSTNAME=${TURNSTILE_EXPECTED_HOSTNAME:-course.csuft.tech}
      # Elasticsearch 配置
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
    volumes:
      - backend_logs:/app/logs
      # 模板本身不含秘密，实际敏感值由上方环境变量注入。
      - ./backend/config/application-prod.example.yml:/app/config/application-prod.yml:ro
    ports:
      # 仅允许宿主机反向代理访问，防止绕过 HTTPS 入口直接请求明文 HTTP。
      - "127.0.0.1:8082:8082"
    networks:
      - local_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Vue 前端
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Site Key 是公开标识，但仍由部署环境注入以隔离测试与生产 Widget。
        - VITE_TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:?TURNSTILE_SITE_KEY is required}
    image: course-platform-frontend:latest
    container_name: course-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "8888:80"  # 映射到宿主机 8888（VPS Nginx 将代理到此端口）
    networks:
      - local_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  es_data:
    driver: local

networks:
  local_net:
    external: true
