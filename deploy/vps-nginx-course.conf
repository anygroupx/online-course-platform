# VPS Nginx 反向代理配置
# 示例文件位置: /etc/nginx/sites-available/course.example.com.conf
# 部署时请将示例域名和上游地址替换为实际配置。

# HTTP → HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name course.example.com;

    return 301 https://course.example.com$request_uri;
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name course.example.com;

    # SSL 证书（Let's Encrypt）
    ssl_certificate     /etc/letsencrypt/live/course.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/course.example.com/privkey.pem;

    # 引入通用 SSL 配置
    include /etc/nginx/snippets/ssl-common.conf;

    # 上传文件大小限制
    client_max_body_size 50M;

    # 日志
    access_log /var/log/nginx/course.access.log;
    error_log /var/log/nginx/course.error.log;

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://192.0.2.10:8082/api/;
        proxy_http_version 1.1;

        # 代理头设置
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # WebSocket 支持（如需要）
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    # 前端静态文件反向代理
    location / {
        proxy_pass http://192.0.2.10:8888/;
        proxy_http_version 1.1;

        # 代理头设置
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 缓存控制
        proxy_cache_bypass $http_upgrade;
    }
}
