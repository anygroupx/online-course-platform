# 本地 Nginx 反向代理配置
# 用途: 提供前端静态文件服务 + 反向代理后端API,实现同源部署
# Source: AURA-X-KYS - KISS原则,通过代理统一域名避免CORS

server {
    listen 8888;
    server_name localhost;
    
    # 前端静态文件根目录 (请根据实际部署路径修改)
    root /var/www/online-course-platform/frontend/dist;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 上传文件大小限制
    client_max_body_size 50M;

    # 日志
    access_log /var/log/nginx/course-local.access.log;
    error_log /var/log/nginx/course-local.error.log;

    # API反向代理到后端 (同机部署,使用127.0.0.1)
    # Source: AURA-X-KYS - 同源代理核心配置
    location /api/ {
        # 转发到本地后端服务 (端口14255)
        proxy_pass http://127.0.0.1:8082/api/;
        proxy_http_version 1.1;
        
        # 代理头设置
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # WebSocket 支持
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    # SPA 路由支持: 所有请求都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存策略
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 禁用缓存 index.html
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # 禁用访问隐藏文件
    location ~ /\. {
        deny all;
    }

    # 健康检查端点
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
