# Nginx 配置文件 - 在线课程平台前端
# 宝塔面板 Nginx 配置
# 文件路径: /www/server/panel/vhost/nginx/online-course-platform.conf
# 部署目录: /www/wwwroot/online-course-platform
# 监听端口: 15174

server {
    listen 15174;
    # 部署时替换为实际域名；下划线表示默认虚拟主机。
    server_name _;

    # 网站根目录
    root /www/wwwroot/online-course-platform;
    index index.html;

    # 仅允许本站资源及 Cloudflare Turnstile 所需的脚本、框架和验证请求。
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com;" always;

    # 字符集
    charset utf-8;

    # 访问日志和错误日志
    access_log /var/log/nginx/online-course-platform-access.log;
    error_log /var/log/nginx/online-course-platform-error.log;

    # Gzip 压缩配置
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # 静态资源缓存配置
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理到后端
    location /api/ {
        # 后端地址使用同机回环地址，跨主机部署时由运维配置覆盖。
        proxy_pass http://127.0.0.1:8082/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Vue Router History 模式支持
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
