name: RBAC Regression

on:
  push:
    branches: [main, master, develop, dev, 'feature/**', 'fix/**', 'perf/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 前端单元测试与生产构建约 15 秒，不再为一个构建付整条 Java+Chromium 安装链的成本。
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Frontend unit tests and production build
        run: npm --prefix frontend test && npm --prefix frontend run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend regressions
        run: mvn -B -f backend/pom.xml -pl course-web -am clean verify

  # RbacAuthContractTest 会 spawn `node tests/rbac.browser.mjs`，因此必须同时具备
  # JDK、Node 与 Playwright Chromium；这是流水线里唯一的双运行时 job。
  browser-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Real login, refresh, MFA and browser permission contract
        run: >-
          mvn -B -f backend/pom.xml -pl course-web -am
          -Dtest=RbacAuthContractTest -Dsurefire.failIfNoSpecifiedTests=false
          -Drbac.browser=true test
      - name: Save contract reports and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rbac-browser-contract
          if-no-files-found: ignore
          path: |
            backend/**/target/surefire-reports/
            .cache/rbac-verification/browser/

  # 浏览器回归是主要瓶颈（37 个脚本串行）。test-server.mjs 已用随机回环端口和
  # 独立临时缓存目录隔离，按名次取模切分可安全并行；清单唯一来源仍是
  # package.json 的 test:browser，脚本增删无需改动本文件。
  browser-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so database regression scripts can replay baseline
          # revisions; a shallow clone makes `git show <rev>:path` fail.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: UI workflow regressions (shard ${{ matrix.shard }}/4)
        working-directory: frontend
        run: node scripts/browser-shard.mjs ${{ matrix.shard }} 4
      - name: Save UI artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-workflows-shard-${{ matrix.shard }}
          if-no-files-found: ignore
          path: |
            .cache/native-service-ui/
            .cache/course-private-operations-*.png

  # Maven 门禁失败时没有必要再拉 MySQL 镜像跑迁移回归。
  mysql-migration:
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # rbac_mysql.py replays database/schema.sql from the e12e059 baseline
          # commit, which a shallow clone does not contain.
          fetch-depth: 0
      - name: Isolated MySQL migration and FK regressions
        # 每个脚本自行创建隔离容器；038 资金回归与039运营升级均为实际门禁。
        run: |
          docker pull mysql:8.0
          python3 database/tests/rbac_mysql.py
          python3 database/tests/course_private_wallet_mysql.py
          python3 database/tests/course_private_operations_mysql.py
