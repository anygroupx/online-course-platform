name: RBAC Regression

on:
  push:
    branches: [main, master, develop, dev, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Backend regressions
        run: mvn -B -f backend/pom.xml -pl course-web -am clean verify
      - name: Real login, refresh, MFA and browser permission contract
        run: >-
          mvn -B -f backend/pom.xml -pl course-web -am
          -Dtest=RbacAuthContractTest -Dsurefire.failIfNoSpecifiedTests=false
          -Drbac.browser=true test
      - name: Frontend unit tests and production build
        run: npm --prefix frontend test && npm --prefix frontend run build
      - name: UI workflow regressions
        # 全量命令包含新增运营浏览器脚本，任一脚本失败都必须阻断门禁。
        run: npm --prefix frontend run test:browser
      - name: Isolated MySQL migration and FK regressions
        # 每个脚本自行创建隔离容器；038 资金回归与039运营升级均为实际门禁。
        run: |
          docker pull mysql:8.0
          python3 database/tests/rbac_mysql.py
          python3 database/tests/course_private_wallet_mysql.py
          python3 database/tests/course_private_operations_mysql.py
      - name: Save test reports and RBAC screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rbac-verification
          path: |
            backend/**/target/surefire-reports/
            .cache/rbac-verification/browser/
            .cache/native-service-ui/
            .cache/course-private-operations-*.png
