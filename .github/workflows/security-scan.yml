name: Security Scan (P2)

on:
  push:
    branches: [ main, master, develop, dev, 'feature/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sca:
    name: 依赖安全门禁（OSV 与 npm audit）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend dependency tree
        working-directory: backend
        run: mvn -B -DskipTests dependency:tree -DoutputFile=target/dependency-tree.txt
      - name: Install OSV Scanner
        working-directory: ${{ runner.temp }}
        run: |
          # 固定官方发布资产并校验摘要，避免 latest 漂移及下载失败被掩盖。
          curl -sSfL https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 -o osv-scanner
          echo '160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  osv-scanner' | sha256sum --check
          chmod +x osv-scanner
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: OSV scan Maven dependencies
        working-directory: backend
        run: osv-scanner scan source --format table -r .
      - name: Frontend npm audit
        working-directory: frontend
        run: npm audit --omit=dev

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 Semgrep
        run: pipx install semgrep
      - name: Semgrep
        # --error 对发现项返回失败，--strict 同时将规则/解析错误作为门禁失败。
        run: semgrep scan --error --strict --config p/owasp-top-ten --config p/java --config p/security-audit .

  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        # 官方 v0.36.0 的不可变提交；完整 SHA 已对照发布页核验。
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table

  dast-baseline:
    name: DAST baseline (optional ZAP)
    runs-on: ubuntu-latest
    if: ${{ vars.DAST_TARGET_URL != '' }}
    steps:
      - name: ZAP baseline against staging
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ vars.DAST_TARGET_URL }}
          fail_action: true

  backend-security-tests:
    name: Backend compile + security unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile
        working-directory: backend
        run: mvn -pl course-web -am -DskipTests compile
      - name: Security-related tests
        working-directory: backend
        run: |
          mvn -pl course-web -am test \
            -Dtest=AuthServiceImplTest,SystemConfigControllerTest,BolaBflaAuthorizationTest,TotpUtilTest \
            -Dsurefire.failIfNoSpecifiedTests=false
