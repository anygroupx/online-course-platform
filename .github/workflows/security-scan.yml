name: Security Scan (P2)

on:
  push:
    branches: [ main, master, develop, dev, 'feature/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sca:
    name: 依赖安全门禁（OSV 与 npm audit）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend resolved dependency inventory
        working-directory: backend
        # 聚合 Maven 实际解析的传递依赖，避免扫描器将私有 reactor 模块误查到公共仓库。
        run: mvn -B -DskipTests org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
      - name: Install OSV Scanner
        working-directory: ${{ runner.temp }}
        run: |
          # 固定官方发布资产并校验摘要，避免 latest 漂移及下载失败被掩盖。
          curl -sSfL https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64 -o osv-scanner
          echo '160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  osv-scanner' | sha256sum --check
          chmod +x osv-scanner
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: OSV scan Maven dependencies
        working-directory: backend
        # 显式指定例外配置：扫描目标在 target/ 下，配置文件必须被显式传入才会生效。
        # 例外仅覆盖已判定不可达的漏洞，且各自带到期日。
        run: osv-scanner scan source --format table --lockfile=target/bom.json --config=osv-scanner.toml
      - name: Frontend npm audit
        working-directory: frontend
        run: npm audit --omit=dev

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 安装 Semgrep
        run: pipx install semgrep
      - name: Semgrep
        # --error 对发现项返回失败，--strict 同时将规则/解析错误作为门禁失败。
        run: semgrep scan --error --strict --config p/owasp-top-ten --config p/java --config p/security-audit .

  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run Trivy filesystem scan
        # 官方 v0.36.0 的不可变提交；完整 SHA 已对照发布页核验。
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table

  dast-baseline:
    name: DAST baseline (optional ZAP)
    runs-on: ubuntu-latest
    if: ${{ vars.DAST_TARGET_URL != '' }}
    steps:
      - name: ZAP baseline against staging
        uses: zaproxy/action-baseline@66042c8e7e24680119199a017e5b0e8603bf4dae # v0.12.0
        with:
          target: ${{ vars.DAST_TARGET_URL }}
          fail_action: true

  backend-security-tests:
    name: Backend compile + security unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile
        working-directory: backend
        run: mvn -pl course-web -am -DskipTests compile
      - name: Security-related tests
        working-directory: backend
        run: |
          mvn -pl course-web -am test \
            -Dtest=AuthServiceImplTest,SystemConfigControllerTest,BolaBflaAuthorizationTest,TotpUtilTest \
            -Dsurefire.failIfNoSpecifiedTests=false
