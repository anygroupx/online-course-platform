name: Security Scan (P2)

on:
  push:
    branches: [ main, master, develop, 'feature/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  sca:
    name: SCA (OSV + Dependency Check lightweight)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend dependency tree
        working-directory: backend
        run: mvn -q -DskipTests dependency:tree -DoutputFile=target/dependency-tree.txt || true
      - name: Install OSV Scanner
        run: |
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
      - name: OSV scan Maven lock-ish
        working-directory: backend
        run: |
          osv-scanner --format table -r . || true
      - name: Frontend npm audit
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm audit --omit=dev || true; else echo "no lockfile"; fi

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/java
            p/security-audit
        continue-on-error: true

  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '0'
          format: table

  dast-baseline:
    name: DAST baseline (optional ZAP)
    runs-on: ubuntu-latest
    if: ${{ vars.DAST_TARGET_URL != '' }}
    steps:
      - name: ZAP baseline against staging
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ vars.DAST_TARGET_URL }}
          fail_action: false

  backend-security-tests:
    name: Backend compile + security unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile
        working-directory: backend
        run: mvn -pl course-web -am -DskipTests compile
      - name: Security-related tests
        working-directory: backend
        run: |
          mvn -pl course-web -am test \
            -Dtest=AuthServiceImplTest,SystemConfigControllerTest,BolaBflaAuthorizationTest,TotpUtilTest \
            -DfailIfNoTests=false
